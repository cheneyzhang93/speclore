<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3da882"/>
      <stop offset="100%" stop-color="#1e6549"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Stylized S with geometric design -->
  <text x="64" y="86" text-anchor="middle" fill="white" font-size="72" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-4">S</text>
  
  <!-- Decorative dot accent -->
  <circle cx="92" cy="42" r="6" fill="white" opacity="0.9"/>
</svg>
